# --- What each Unit of the closed set is called ---

[units]
gram = [
    "gm", "gram", "grams",
]
kilogram = [
    "kgs", "kilo", "kilos", "kilogram", "kilograms",
]
ounce = [
    "ounce", "ounces",
]
# The pound sign of an old American recipe card, `¼ # butter`.
pound = [
    "pound", "pounds", "#",
]
millilitre = [
    "mls", "millilitre", "millilitres", "milliliter", "milliliters",
]
centilitre = [
    "centilitre", "centilitres", "centiliter", "centiliters",
]
decilitre = [
    "decilitre", "decilitres", "deciliter", "deciliters",
]
litre = [
    "lt", "litre", "litres", "liter", "liters",
]
teaspoon = [
    "tsps", "ts", "teaspoon", "teaspoons",
]
tablespoon = [
    "tbsps", "tbs", "tb", "tablespoon", "tablespoons",
]
# A lone `c` is the cup of an old American recipe card, `3/4 c brown sugar`.
cup = [
    "c",
]
# The US liquid quart, four cups (#182). The bare word `quart` is left out
# on purpose: in French it is a quarter, and a Step reading *laisser reposer
# 1 quart d'heure* would be offered a conversion into litres.
quart = [
    "qt", "qts", "usqt", "us qt", "us qts", "us quart", "us quarts",
]
"fluid ounce" = [
    "floz", "fluid ounce", "fluid ounces",
]
"imperial tablespoon" = [
    "imperial tablespoon", "imperial tablespoons", "imperial tbsp",
]
"australian tablespoon" = [
    "australian tablespoon", "australian tablespoons", "australian tbsp",
    "aus tbsp",
]

