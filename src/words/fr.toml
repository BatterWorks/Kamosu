# The short forms a French recipe writes as often as the long (#161).
# `cuillère à thé` is the same spoon as Quebec names it: `thé` is a word of
# a Food's name everywhere else, so the reader needs the whole Unit (#213).
# `cc` is *cuillère à café*, never a cubic centimetre: the accepted cost is
# an English `5 cc`, which reads five times too big (#208).
teaspoon = [
    "cuillère à café", "cuillere a cafe", "cuillères à café",
    "cuilleres a cafe", "c à café", "c a cafe", "cuil à café", "cuil a cafe",
    "cuill à café", "cuill a cafe", "cuillère à thé", "cuillere a the",
