# A Dutch recipe is read with this file and `every.toml`, and with no other
# Language's words. Every kitchen word here was checked against how Dutch recipes
# are really written: the pages named in `tests/fixtures/dutch/lines.json`, and
# the Dutch unit names Mealie ships. A misread line goes in that file too.

