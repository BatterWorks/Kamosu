# Dutch writes an adjective before the noun, so a word that says nothing about
# what to buy is a size here wherever it says that: `verse peterselie` is
# *peterselie*, and `fijngehakte ui` is *ui*. A word that does say what to buy
# stays out, and in `describing`: `gerookte zalm` is not fresh salmon, and
# `gehakt` is a food.
