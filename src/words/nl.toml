# --- What each Unit of the closed set is called ---

[units]
gram = ["gram", "grammen"]
kilogram = ["kilo", "kilos", "kilogram", "kilogrammen"]
millilitre = ["milliliter", "milliliters"]
centilitre = ["centiliter", "centiliters"]
