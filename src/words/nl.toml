litre = ["liter", "liters", "ltr"]
# `etl` and `eetl` are how recipes shorten it. `el` is a Spanish article and `kl`
# nothing at all elsewhere, which is why these live here. Flanders says
# `soeplepel` and `koffielepel` for the same spoons.
