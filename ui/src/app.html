<!doctype html>
<html lang="en">
	<head>
		<meta charset="utf-8" />
		<!-- The platform this project targets is iOS Safari (ADR 0012): the app must
		     fill a phone, survive a notch, and never zoom when a field is focused. -->
		<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
		<!-- Filled in from --color-ground by the root layout: a colour typed here
		     would be a second place the look lives. -->
		<meta name="theme-color" />
		<!-- Chrome on Android sets the root's font size from the system's text
		     size once a page asks for it this way (#228). `--type-unit` in
		     `app.css` is what reads it, and iOS is asked there. -->
		<meta name="text-scale" content="scale" />
		<meta name="mobile-web-app-capable" content="yes" />
		<meta name="apple-mobile-web-app-title" content="Kamosu" />
		<link rel="manifest" href="/manifest.webmanifest" />
		<link rel="icon" href="/favicon.svg" type="image/svg+xml" />
		<link rel="icon" href="/assets/icons/favicon-32.png" sizes="32x32" type="image/png" />
		<link rel="apple-touch-icon" href="/assets/icons/apple-touch-icon.png" />
		<!-- The browser's offer to install Kamosu (#173) arrives as soon as the
		     manifest is read, which, once the service worker is in control, is
		     before the app has started: 215 ms in, where the app was not yet
		     listening. So the first is caught here, first thing, and kept for the
		     app, which takes it in `holdTheInstallOffer` and hears the rest itself. Allowed by the page's
		     security policy, which names each script written into the shell by its hash. -->
		<script>
			addEventListener(
				'beforeinstallprompt',
				function (event) {
					event.preventDefault();
					window.kamosuInstallOffer = event;
				},
				{ once: true },
			);
		</script>
		%sveltekit.head%
	</head>
	<body data-sveltekit-preload-data="hover">
		<div style="display: contents">%sveltekit.body%</div>
	</body>
</html>
